name: Validate Odoo 19 Docker template

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare generated files
        run: |
          cp .env.example .env
          sed             -e 's/__ODOO_MASTER_PASSWORD__/validation-only/g'             -e 's/__ODOO_WORKERS__/2/g'             -e 's/__ODOO_MAX_CRON_THREADS__/1/g'             -e 's/__ODOO_DB_MAXCONN__/16/g'             config/odoo.conf.example > config/odoo.conf
          ! grep -q '__ODOO_' config/odoo.conf

      - name: Validate shell scripts
        run: |
          bash -n run.sh
          bash -n rebuild.sh
          bash -n finalize.sh

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Guard unsafe template regressions
        run: |
          ! grep -R -nE 'user:[[:space:]]*root|chmod[[:space:]]+-R[[:space:]]+777' docker-compose.yml run.sh rebuild.sh finalize.sh
          grep -q '127.0.0.1' docker-compose.yml
          grep -q 'proxy_mode = True' config/odoo.conf.example
